# SOLARIS ONE v7 | Public portal with persistent visitor requests, staff response and sanitized energy statistics
name: purdue-ot-ad-lab
x-py:
  image: python:3.12-slim
  working_dir: /app
  volumes: &id001
  - ./services:/app:ro
  restart: unless-stopped
services:
  attacker:
    build: ./workstation
    hostname: attacker
    profiles:
    - redteam
    networks:
    - wan_sim
    command:
    - sleep
    - infinity
  web-entry:
    image: python:3.12-slim
    working_dir: /app
    volumes: *id001
    restart: unless-stopped
    command:
    - python
    - -u
    - /app/tcp_relay.py
    sysctls:
    - net.ipv4.ip_forward=0
    environment:
      TCP_RELAYS: 8080=web-server:80
    networks:
    - wan_sim
    - web_dmz
  ics-dc01:
    build: ./ad
    hostname: ics-dc01
    environment:
      AD_REALM: ICS.OTLAB.TEST
      AD_NETBIOS: ICS
      AD_HOSTNAME: ics-dc01
      AD_IP: 172.18.10.10
      AD_ADMIN_PASSWORD: ${ICS_AD_ADMIN_PASSWORD:?Run scripts/init_env.py}
      AD_USER: icsoperator
      AD_USER_PASSWORD: ${ICS_AD_OPERATOR_PASSWORD:?Run scripts/init_env.py}
    cap_add:
    - SYS_ADMIN
    networks:
      level3:
        ipv4_address: 172.18.10.10
    volumes:
    - ics_ad_lib:/var/lib/samba
    - ics_ad_etc:/etc/samba
    - ics_ad_cache:/var/cache/samba
    restart: unless-stopped
  historian-conduit:
    image: python:3.12-slim
    working_dir: /app
    volumes: *id001
    restart: unless-stopped
    command:
    - python
    - -u
    - /app/http_relay.py
    sysctls:
    - net.ipv4.ip_forward=0
    environment:
      LISTEN_PORT: '8080'
      TARGET_URL: http://historian:8080
      ALLOWED_PATHS: /api/latest,/api/history,/api/plant/latest,/api/plant/history,/api/devices/latest,/api/devices/history
      ALLOWED_METHODS: GET
    networks:
    - level3
    - idmz
  soc-conduit:
    image: python:3.12-slim
    working_dir: /app
    volumes: *id001
    restart: unless-stopped
    command:
    - python
    - -u
    - /app/http_relay.py
    sysctls:
    - net.ipv4.ip_forward=0
    environment:
      LISTEN_PORT: '8080'
      TARGET_URL: http://soc-collector:8080
      ALLOWED_PATHS: /api/events
      ALLOWED_METHODS: POST
      CONDUIT_ALLOW_UNAUTH_POST: 'true'
    networks:
    - level3
    - soc
  jump-server:
    build: ./jump
    environment:
      JUMP_PASSWORD: ${JUMP_PASSWORD:?Run scripts/init_env.py}
      HISTORIAN_URL: http://historian-conduit:8080
    networks:
    - idmz
    restart: unless-stopped
  jump-entry:
    image: python:3.12-slim
    working_dir: /app
    volumes: *id001
    restart: unless-stopped
    command:
    - python
    - -u
    - /app/tcp_relay.py
    sysctls:
    - net.ipv4.ip_forward=0
    environment:
      TCP_RELAYS: 2222=jump-server:22
    networks:
    - level4
    - idmz
    ports:
    - 127.0.0.1:2222:2222
  dc01:
    build: ./ad
    hostname: dc01
    environment:
      AD_REALM: CORP.OTLAB.TEST
      AD_NETBIOS: CORP
      AD_HOSTNAME: dc01
      AD_IP: 10.0.0.10
      AD_ADMIN_PASSWORD: ${CORP_AD_ADMIN_PASSWORD:?Run scripts/init_env.py}
      AD_USER: analyst
      AD_USER_PASSWORD: ${CORP_AD_ANALYST_PASSWORD:?Run scripts/init_env.py}
    cap_add:
    - SYS_ADMIN
    networks:
      level4:
        ipv4_address: 10.0.0.10
    volumes:
    - corp_ad_lib:/var/lib/samba
    - corp_ad_etc:/etc/samba
    - corp_ad_cache:/var/cache/samba
    restart: unless-stopped
  it-workstation:
    build: ./workstation
    hostname: it-workstation
    networks:
    - level4
    environment:
      AD_REALM: CORP.OTLAB.TEST
      HISTORIAN_URL: http://it-access:8080
      CORPORATE_URL: http://corp-portal:8080
    command:
    - sleep
    - infinity
    depends_on:
    - dc01
  db01:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: otlab
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run scripts/init_env.py}
      POSTGRES_DB: corporate
    volumes:
    - postgres_data:/var/lib/postgresql/data
    - ./db/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    networks:
    - level4
    restart: unless-stopped
  corp-portal:
    build:
      context: .
      dockerfile: services/Dockerfile.corp
    environment:
      DB_HOST: db01
      DB_USER: otlab
      DB_PASSWORD: ${DB_PASSWORD:?Run scripts/init_env.py}
      DB_NAME: corporate
      PORT: '8080'
      AD_HOST: dc01
      AD_DOMAIN: corp.otlab.test
    networks:
      level4:
        ipv4_address: 10.0.0.31
    depends_on:
    - db01
    ports:
    - 127.0.0.1:18082:8080
    restart: unless-stopped
  ca01:
    build: ./ca
    hostname: ca01
    networks:
    - level4
    volumes:
    - ca_data:/data
    environment:
      CA_ENROLL_TOKEN: ${CA_ENROLL_TOKEN:?Run scripts/init_env.py}
    ports:
    - 127.0.0.1:18083:8080
    restart: unless-stopped
  it-access:
    build:
      context: .
      dockerfile: services/Dockerfile.gateway
    sysctls:
    - net.ipv4.ip_forward=0
    environment:
      AD_HOST: dc01
      AD_DOMAIN: corp.otlab.test
      HISTORIAN_URL: http://historian-conduit:8080
      PORT: '8080'
    depends_on:
    - dc01
    - historian-conduit
    networks:
      level4:
        ipv4_address: 10.0.0.30
      idmz: {}
    ports:
    - 127.0.0.1:18080:8080
    restart: unless-stopped
  web-server:
    image: nginx:1.27-alpine
    networks:
    - web_dmz
    volumes:
    - ./docs/web/index.html:/usr/share/nginx/html/index.html:ro
    - ./docs/web/style.css:/usr/share/nginx/html/style.css:ro
    - ./docs/web/app.js:/usr/share/nginx/html/app.js:ro
    - ./docs/web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
    - 127.0.0.1:18081:80
    restart: unless-stopped
  soc-collector:
    image: python:3.12-slim
    working_dir: /app
    volumes:
    - ./services:/app:ro
    - soc_data:/data
    restart: unless-stopped
    command:
    - python
    - -u
    - /app/soc.py
    environment:
      PORT: '8080'
      DB_PATH: /data/soc.sqlite3
      SOC_ELASTIC_URL: http://elastic:9200
    networks:
    - soc
    ports:
    - 127.0.0.1:19090:8080
  elastic:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    profiles:
    - elastic
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    mem_limit: 2g
    volumes:
    - elastic_data:/usr/share/elasticsearch/data
    networks:
    - soc
    ports:
    - 127.0.0.1:19200:9200
  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.0
    profiles:
    - elastic
    depends_on:
    - elastic
    environment:
      ELASTICSEARCH_HOSTS: http://elastic:9200
    networks:
    - soc
    ports:
    - 127.0.0.1:15601:5601
  met-station:
    image: python:3.12-slim
    working_dir: /app
    volumes:
    - ./services:/app:ro
    restart: unless-stopped
    command:
    - python
    - -u
    - /app/solar_weather.py
    networks:
      level0:
        ipv4_address: 192.168.96.5
    environment: {}
  pv-array-01:
    image: python:3.12-slim
    working_dir: /app
    volumes:
    - ./services:/app:ro
    - pv_01_state:/state
    restart: unless-stopped
    command:
    - python
    - -u
    - /app/solar_array.py
    networks:
      level0:
        ipv4_address: 192.168.96.21
    environment:
      ASSET_ID: PV-01
      STRINGS: '36'
      DC_KWP: '2800'
      YIELD_FACTOR: '1.0'
      WEATHER_URL: http://met-station:8080
      SOILING_PCT: '0.8'
      FAILED_STRINGS: '0'
      CONTROL_TOKEN: ${CONTROL_TOKEN:?Run scripts/init_env.py}
      STATE_FILE: /state/maintenance.json
  array-conduit-01:
    image: python:3.12-slim
    working_dir: /app
    volumes:
    - ./services:/app:ro
    restart: unless-stopped
    command:
    - python
    - -u
    - /app/http_relay.py
    networks:
    - level0
    - level1
    environment:
      LISTEN_PORT: '8080'
      TARGET_URL: http://pv-array-01:8080
      ALLOWED_PATHS: /api/state
      ALLOWED_METHODS: GET
    sysctls:
    - net.ipv4.ip_forward=0
  inverter-01:
    image: python:3.12-slim
