name: purdue-ot-ad-lab

# Strict zone mode: no universal management bridge. Each conduit is an explicit
# dual-homed *application relay*, not a router; Docker inter-bridge isolation applies.
x-py: &py
  image: python:3.12-slim
  working_dir: /app
  volumes: ["./services:/app:ro"]
  restart: unless-stopped

services:
  # Optional attacker/test terminal, representing the diagram's WAN node.
  # It has no route to the real Internet, corporate IT, or the OT controllers.
  attacker:
    build: ./workstation
    hostname: attacker
    profiles: [redteam]
    networks: [wan_sim]
    command: ["sleep", "infinity"]

  # Synthetic WAN -> Web DMZ (single permitted HTTP destination).
  web-entry:
    <<: *py
    command: ["python", "-u", "/app/tcp_relay.py"]
    sysctls: ["net.ipv4.ip_forward=0"]
    environment: {TCP_RELAYS: '8080=web-server:80'}
    networks: [wan_sim, web_dmz]

  # Level 0 - physical process emulation
  field-sim:
    <<: *py
    command: ["python", "-u", "/app/field.py"]
    networks: {level0: {ipv4_address: 192.168.96.10}}
    environment: {PORT: "8080"}
  # Level 0 -> 1: narrow process I/O path
  field-conduit:
    <<: *py
    command: ["python", "-u", "/app/http_relay.py"]
    sysctls: ["net.ipv4.ip_forward=0"]
    environment:
      LISTEN_PORT: "8080"
      TARGET_URL: http://field-sim:8080
      ALLOWED_PATHS: /api/state,/api/actuator
      ALLOWED_METHODS: GET,POST
    networks: [level0, level1]

  # Level 1 - basic control loop, Modbus TCP server
  plc-demo:
    <<: *py
    command: ["python", "-u", "/app/plc.py"]
    environment:
      FIELD_URL: http://field-conduit:8080
      MODBUS_PORT: "15020"
    networks: [level1]
    depends_on: [field-conduit]

  # Level 1 -> 2: allowlisted process and mrhOTshOT Modbus conduit
  control-conduit:
    <<: *py
    command: ["python", "-u", "/app/tcp_relay.py"]
    sysctls: ["net.ipv4.ip_forward=0"]
    environment:
      TCP_RELAYS: '15020=plc-demo:15020,502=plc-heating-l1:502'
    networks:
      level1: {}
      level2:
        aliases: [plc-heating]
    depends_on: [plc-demo]

  # Level 2 - SCADA polls the L1 control endpoint, not the L0 fieldbus
  scada:
    <<: *py
    command: ["python", "-u", "/app/scada.py"]
    environment: {MODBUS_HOST: control-conduit, MODBUS_PORT: "15020", PORT: "8080"}
    networks: [level2]
    ports: ["127.0.0.1:1882:8080"]
    depends_on: [control-conduit]

  # Level 2 -> 3: read-only telemetry conduit
  supervisory-conduit:
    <<: *py
    command: ["python", "-u", "/app/http_relay.py"]
    sysctls: ["net.ipv4.ip_forward=0"]
    environment:
      LISTEN_PORT: "8080"
      TARGET_URL: http://scada:8080
      ALLOWED_PATHS: /api/state
      ALLOWED_METHODS: GET
    networks: [level2, level3]

  # Level 3 - operations, historian, independent OT AD domain
  historian:
    <<: *py
    command: ["python", "-u", "/app/historian.py"]
    environment:
      POLL_URL: http://supervisory-conduit:8080/api/state
      SOC_URL: http://soc-conduit:8080/api/events
      DB_PATH: /data/historian.sqlite3
      PORT: "8080"
    volumes:
      - ./services:/app:ro
      - historian_data:/data
    networks: [level3]
    depends_on: [supervisory-conduit]

  ics-dc01:
    build: ./ad
    hostname: ics-dc01
    environment:
      AD_REALM: ICS.OTLAB.TEST
      AD_NETBIOS: ICS
      AD_HOSTNAME: ics-dc01
      AD_IP: 172.18.10.10
      AD_ADMIN_PASSWORD: ${ICS_AD_ADMIN_PASSWORD:?Run scripts/init_env.py}
      AD_USER: icsoperator
      AD_USER_PASSWORD: ${ICS_AD_OPERATOR_PASSWORD:?Run scripts/init_env.py}
    cap_add: [SYS_ADMIN]
    networks: {level3: {ipv4_address: 172.18.10.10}}
    volumes:
      - ics_ad_lib:/var/lib/samba
      - ics_ad_etc:/etc/samba
      - ics_ad_cache:/var/cache/samba
    restart: unless-stopped

  # Level 3 -> IDMZ: read-only historian query conduit
  historian-conduit:
    <<: *py
    command: ["python", "-u", "/app/http_relay.py"]
    sysctls: ["net.ipv4.ip_forward=0"]
    environment:
      LISTEN_PORT: "8080"
      TARGET_URL: http://historian:8080
      ALLOWED_PATHS: /api/latest,/api/history
      ALLOWED_METHODS: GET
    networks: [level3, idmz]

  # Level 3 -> SOC: telemetry/alerts, *one-way at the application level*
  soc-conduit:
    <<: *py
    command: ["python", "-u", "/app/http_relay.py"]
    sysctls: ["net.ipv4.ip_forward=0"]
    environment:
      LISTEN_PORT: "8080"
      TARGET_URL: http://soc-collector:8080
      ALLOWED_PATHS: /api/events
      ALLOWED_METHODS: POST
    networks: [level3, soc]

  # Level 3.5 - IDMZ jump server (no L3 network interface)
  jump-server:
    build: ./jump
    environment: {JUMP_PASSWORD: '${JUMP_PASSWORD:?Run scripts/init_env.py}'}
    networks: [idmz]
    restart: unless-stopped

  # IT -> IDMZ: narrow SSH entry, not general routing
  jump-entry:
    <<: *py
    command: ["python", "-u", "/app/tcp_relay.py"]
    sysctls: ["net.ipv4.ip_forward=0"]
    environment: {TCP_RELAYS: '2222=jump-server:22'}
    networks: [level4, idmz]
    ports: ["127.0.0.1:2222:2222"]

  # Level 4 - Enterprise AD + IT assets
  dc01:
    build: ./ad
    hostname: dc01
    environment:
      AD_REALM: CORP.OTLAB.TEST
      AD_NETBIOS: CORP
      AD_HOSTNAME: dc01
      AD_IP: 10.0.0.10
      AD_ADMIN_PASSWORD: ${CORP_AD_ADMIN_PASSWORD:?Run scripts/init_env.py}
      AD_USER: analyst
      AD_USER_PASSWORD: ${CORP_AD_ANALYST_PASSWORD:?Run scripts/init_env.py}
    cap_add: [SYS_ADMIN]
    networks: {level4: {ipv4_address: 10.0.0.10}}
    volumes:
      - corp_ad_lib:/var/lib/samba
      - corp_ad_etc:/etc/samba
      - corp_ad_cache:/var/cache/samba
    restart: unless-stopped

  it-workstation:
    build: ./workstation
    hostname: it-workstation
    networks: [level4]
    dns: [10.0.0.10]
    environment: {AD_REALM: CORP.OTLAB.TEST}
    command: ["sleep", "infinity"]
    depends_on: [dc01]

  db01:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: otlab
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run scripts/init_env.py}
      POSTGRES_DB: corporate
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    networks: [level4]
    restart: unless-stopped

  ca01:
    build: ./ca
    hostname: ca01
    networks: [level4]
    volumes: ["ca_data:/data"]
    restart: unless-stopped

  # AD-validated, read-only IT->historian access. Only service spanning IT/IDMZ.
  it-access:
    build:
      context: .
      dockerfile: services/Dockerfile.gateway
    sysctls: ["net.ipv4.ip_forward=0"]
    environment:
      AD_HOST: dc01
      AD_DOMAIN: corp.otlab.test
      HISTORIAN_URL: http://historian-conduit:8080
      PORT: "8080"
    depends_on: [dc01, historian-conduit]
    networks: [level4, idmz]
    ports: ["127.0.0.1:18080:8080"]
    restart: unless-stopped

  # External web DMZ from reference figure; NO real Internet uplink
  web-server:
    image: nginx:1.27-alpine
    networks: [web_dmz]
    volumes: ["./docs/web/index.html:/usr/share/nginx/html/index.html:ro"]
    ports: ["127.0.0.1:18081:80"]
    restart: unless-stopped

  # SOC collection (lightweight), optional Malcolm/Elastic separately
  soc-collector:
    <<: *py
    command: ["python", "-u", "/app/soc.py"]
    environment: {PORT: "8080", DB_PATH: /data/soc.sqlite3, SOC_ELASTIC_URL: "http://elastic:9200"}
    volumes:
      - ./services:/app:ro
      - soc_data:/data
    networks: [soc]
    ports: ["127.0.0.1:19090:8080"]

  # Opt-in Elasticsearch and Kibana in SOC zone; no published public interfaces.
  # Kibana here is a search UI, not a preconfigured enterprise SIEM.
  elastic:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    profiles: [elastic]
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'  # INSECURE demo: isolated SOC network only
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    mem_limit: 2g
    volumes: [elastic_data:/usr/share/elasticsearch/data]
    networks: [soc]
    ports: ["127.0.0.1:19200:9200"]
  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.0
    profiles: [elastic]
    depends_on: [elastic]
    environment:
      ELASTICSEARCH_HOSTS: http://elastic:9200
    networks: [soc]
    ports: ["127.0.0.1:15601:5601"]

networks:
  wan_sim:
    driver: bridge
    internal: true
    ipam: {config: [{subnet: 198.18.0.0/24}]}
  level4:
    driver: bridge
    internal: true
    ipam: {config: [{subnet: 10.0.0.0/24}]}
  web_dmz:
    driver: bridge
    internal: true
    ipam: {config: [{subnet: 10.6.6.0/24}]}
  idmz:
    driver: bridge
    internal: true
    ipam: {config: [{subnet: 10.7.7.0/24}]}
  level3:
    driver: bridge
    internal: true
    ipam: {config: [{subnet: 172.18.10.0/24}]}
  level2:
    driver: bridge
    internal: true
    ipam: {config: [{subnet: 172.18.20.0/24}]}
  level1:
    driver: bridge
    internal: true
    ipam: {config: [{subnet: 192.168.95.0/24}]}
  level0:
    driver: bridge
    internal: true
    ipam: {config: [{subnet: 192.168.96.0/24}]}
  soc:
    driver: bridge
    internal: true
    ipam: {config: [{subnet: 192.168.200.0/24}]}

volumes:
  corp_ad_lib: {}
  corp_ad_etc: {}
  corp_ad_cache: {}
  ics_ad_lib: {}
  ics_ad_etc: {}
  ics_ad_cache: {}
  historian_data: {}
  soc_data: {}
  ca_data: {}
  postgres_data: {}

  elastic_data: {}
