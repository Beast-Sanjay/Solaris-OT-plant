# This file is mounted into /etc/nginx/conf.d/, inside nginx's http context.
limit_req_zone $binary_remote_addr zone=public_write:10m rate=8r/m;
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 4k;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    server_tokens off;
    location = / { try_files /index.html =404; }
    location = /index.html { try_files /index.html =404; }
    location = /style.css { try_files /style.css =404; }
    location = /app.js { try_files /app.js =404; }
    location = /api/public { limit_except GET { deny all; } proxy_pass http://public-publisher:8080; proxy_read_timeout 5s; }
    location = /api/public/history { limit_except GET { deny all; } proxy_pass http://public-publisher:8080; proxy_read_timeout 5s; }
    location = /api/public/statistics { limit_except GET { deny all; } proxy_pass http://public-publisher:8080; proxy_read_timeout 5s; }
    location = /api/public/notices { limit_except GET { deny all; } proxy_pass http://public-publisher:8080; proxy_read_timeout 5s; }
    location = /api/enquiries {
        limit_except POST { deny all; }
        limit_req zone=public_write burst=5 nodelay;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Content-Type $content_type;
        proxy_pass http://public-publisher:8080;
        proxy_read_timeout 8s;
    }
    location = /api/enquiries/track {
        limit_except POST { deny all; }
        limit_req zone=public_write burst=10 nodelay;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Content-Type $content_type;
        proxy_pass http://public-publisher:8080;
        proxy_read_timeout 8s;
    }
    # Explicitly prevent public access to /api/internal/* and all industrial apps.
    location / { return 404; }
}
